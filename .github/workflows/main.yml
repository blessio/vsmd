name: CI

# Build VSIX packages in production and debug mode.
# Run tests against debug build.
#
# This workflow is designed to be run on pushing to master branch.

on:
  pull_request: 
    branches: ["master", "blessio*"]
  push:
    branches: ["master", "blessio*"]
    paths:
      - ".github/workflows/*.yml"
      - "src/**"
      - "syntaxes/**"
      - ".*"
      - "package*.json"
      - "tsconfig.json"
      - "webpack.*"
      - "!**.md"
  workflow_dispatch:
  repository_dispatch:
    types: ["package"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: "Setup Node.js environment"
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust Toolchain for GitHub CI
        uses: actions-rust-lang/setup-rust-toolchain@v1.15

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: "Install dependencies"
        run: |
          echo "*************** run build-wasm *****************"
          npm run build-wasm
          echo "*************** run CI *****************"
          npm ci

      # Our prepublish script runs in production mode by default.
      # We should run tests against debug build to make error messages as useful as possible.
      - name: "Build release"
        run: |
          npx vsce package --pre-release

          export NODE_ENV='development'
          npx vsce package --pre-release --out debug.vsix

      - name: Test
        uses: GabrielBB/xvfb-action@v1.0
        with:
          run: npm test

      - name: "Rust test"
        run: |
          cd ./src/zola-slug/
          cargo test --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Markdown-All-in-One-${{ github.sha }}
          path: ./*.vsix

      # If the run failed, npm log may help to diagnose.
      - name: "(debug) Upload npm log"
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: "npm-debug-log"
          path: "~/.npm/_logs"
